# Local development stack: `make up` starts all services
# (postgres + migrate + web + worker). By default it serves unauthenticated
# requests on loopback only (AUTH_MODE=none, ALLOW_INSECURE_NO_AUTH=true,
# every published port bound to 127.0.0.1). It is not used for any hosted
# deployment: AWS deploys from infra/aws (CDK) and never reads this file.
#
# The `${VAR:-default}` values below are the lowest-priority source. Compose
# ranks the shell environment first, then infra/docker/.env, then these
# defaults, so setting a non-empty value in either place wins. AUTH_MODE and
# ALLOW_INSECURE_NO_AUTH use the colon-less form on purpose: an explicitly
# empty value reaches the app and fails startup instead of silently falling
# back to the unauthenticated defaults.

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-postgresql://tracker:tracker@postgres:5432/tracker}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_service}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-worker}
    volumes:
      - ../../scripts:/scripts:ro
      - ../../db:/db:ro
    entrypoint: ["bash", "/scripts/migrate.sh"]
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://app:app@postgres:5432/tracker}
      HOST: "0.0.0.0"
      PORT: "3000"
      # Local development defaults: an unauthenticated stack on loopback.
      # Override any of them in the shell or in infra/docker/.env; both rank
      # above these defaults. AUTH_MODE=cognito is not supported here: it
      # requires DB_HOST/DB_PASSWORD, which this service does not wire.
      AUTH_MODE: ${AUTH_MODE-none}
      ALLOW_INSECURE_NO_AUTH: ${ALLOW_INSECURE_NO_AUTH-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_REGION: ${COGNITO_REGION:-}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-localhost:8081}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Standalone auth service. It requires real Cognito credentials, so the
  # `cognito` profile keeps it out of the default stack; starting it does not
  # make the web service authenticated, and the authenticated deployment lives
  # in infra/aws. To work on this service alone, enable the profile in the
  # shell or in infra/docker/.env:
  #   COMPOSE_PROFILES=cognito docker compose -f infra/docker/compose.yml up -d
  auth:
    profiles: ["cognito"]
    build:
      context: ../..
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: "8081"
      ALLOWED_REDIRECT_URIS: ${ALLOWED_REDIRECT_URIS:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_REGION: ${COGNITO_REGION:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8081}
      OAUTH_RESOURCE: ${OAUTH_RESOURCE:-http://localhost:8082/mcp}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://auth_service:${AUTH_DB_PASSWORD:-auth_service}@postgres:5432/tracker}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://worker:${WORKER_DB_PASSWORD:-worker}@postgres:5432/tracker
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
