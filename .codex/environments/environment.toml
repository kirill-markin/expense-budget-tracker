  "$CODEX_SOURCE_TREE_PATH/infra/aws/cdk.context.local.json" \
  "$CODEX_WORKTREE_PATH/infra/aws/cdk.context.local.json"
link_if_exists \
  "$CODEX_SOURCE_TREE_PATH/scripts/cloudflare/.env" \
  "$CODEX_WORKTREE_PATH/scripts/cloudflare/.env"

'''
