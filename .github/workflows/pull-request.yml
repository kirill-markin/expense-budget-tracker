name: Pull Request

on:
  pull_request:
    branches: [main, integration-mcp-readonly-sql]

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality_gate:
    name: PR Quality Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      auth_tests: ${{ steps.changes.outputs.auth_tests }}
      infra_tests: ${{ steps.changes.outputs.infra_tests }}
      shared_tests: ${{ steps.changes.outputs.shared_tests }}
      sql_api_tests: ${{ steps.changes.outputs.sql_api_tests }}
      web_tests: ${{ steps.changes.outputs.web_tests }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'infra/**'
              - 'db/migrations/**'
              - 'scripts/migrate.sh'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
            auth_tests:
              - 'apps/auth/**'
              - 'packages/agent-shared/**'
              - 'db/migrations/**'
              - 'scripts/migrate.sh'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
            infra_tests:
              - 'infra/aws/**'
              - 'packages/agent-shared/**'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
            sql_api_tests:
              - 'apps/sql-api/**'
              - 'packages/agent-shared/**'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
            web_tests:
              - 'apps/web/**'
              - 'packages/agent-shared/**'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'
            shared_tests:
              - 'packages/agent-shared/**'
              - '.github/workflows/pull-request.yml'
              - '.npmrc'
              - '.nvmrc'
              - 'package.json'
              - 'package-lock.json'

      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up npm
        if: steps.changes.outputs.code == 'true'
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        if: steps.changes.outputs.code == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.code == 'true'
        run: npm run lint --workspaces --if-present

  extended_unit_tests:
    name: Extended Unit Tests
    needs: quality_gate
    if: >-
      ${{
        !cancelled()
        && (
          needs.quality_gate.outputs.auth_tests == 'true'
          || needs.quality_gate.outputs.infra_tests == 'true'
          || needs.quality_gate.outputs.shared_tests == 'true'
          || needs.quality_gate.outputs.sql_api_tests == 'true'
          || needs.quality_gate.outputs.web_tests == 'true'
        )
      }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tracker -d tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Install PostgreSQL client
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.auth_tests == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply auth test database migrations
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.auth_tests == 'true' }}
        run: bash scripts/migrate.sh
        env:
          MIGRATION_DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker
          APP_DB_PASSWORD: app
          AUTH_DB_PASSWORD: auth_service
          WORKER_DB_PASSWORD: worker

      - name: Run auth tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.auth_tests == 'true' }}
        run: npm --workspace expense-tracker-auth run test
        env:
          MIGRATION_DATABASE_URL: postgresql://tracker:tracker@localhost:5432/tracker
          AUTH_DATABASE_URL: postgresql://auth_service:auth_service@localhost:5432/tracker

      - name: Run AWS infrastructure unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.infra_tests == 'true' }}
        run: npm --workspace expense-budget-tracker-aws run test

      - name: Run SQL API unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.sql_api_tests == 'true' }}
        run: npm --workspace expense-budget-tracker-sql-api run test

      - name: Run web unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.web_tests == 'true' }}
        run: npm --workspace expense-budget-tracker-web run test

      - name: Run shared unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && needs.quality_gate.outputs.shared_tests == 'true' }}
        run: npm --workspace @expense-budget-tracker/agent-shared run test
