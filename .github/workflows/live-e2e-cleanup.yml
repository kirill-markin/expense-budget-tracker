# Cleanup stale E2E test workspaces.
#
# Uses the demo email bypass to authenticate, then lists workspaces
# and deletes any with the "E2E " prefix older than the configured TTL.
name: Live E2E Cleanup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPENSE_LIVE_E2E_AUTH_BASE_URL: https://auth.${{ vars.CDK_DOMAIN_NAME }}
  EXPENSE_LIVE_E2E_APP_BASE_URL: https://app.${{ vars.CDK_DOMAIN_NAME }}
  EXPENSE_LIVE_E2E_REVIEW_EMAILS: e2e-test@example.com
  EXPENSE_LIVE_E2E_WORKSPACE_PREFIX: "E2E "
  EXPENSE_LIVE_E2E_WORKSPACE_TTL_HOURS: "48"

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Clean up stale E2E workspaces
        run: node scripts/cleanup-live-e2e-workspaces.mjs
