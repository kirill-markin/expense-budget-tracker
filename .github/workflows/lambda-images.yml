name: Lambda image checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    name: Packaged Lambda (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-26.04
          - architecture: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build and invoke real AWS Lambda images
        run: node scripts/checks/check-lambda-images.mjs ${{ matrix.architecture }}
